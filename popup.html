<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AA Plus</title>
<style>
  :root { color-scheme: light dark; --ink: #000; --bg: #fff; --soft: #f1f2f4; --line: #d9d9d9; --mute: #737373; }
  @media (prefers-color-scheme: dark) { :root { --ink: #fff; --bg: #0a0a0a; --soft: #262626; --line: #404040; --mute: #a3a3a3; } }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; padding: 14px 16px 12px; background: var(--bg); color: var(--ink); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
  header img { width: 26px; height: 26px; border-radius: 6px; display: block; }
  header h1 { margin: 0; font: 500 19px/1.1 Georgia, Cambria, serif; }
  header a { margin-left: auto; font-size: 12px; color: var(--mute); }
  .label { margin: 14px 0 6px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); }
  .label:first-of-type { margin-top: 0; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px; border-radius: 4px; background: var(--soft); }
  .seg button { flex: 1 1 auto; height: 28px; padding: 0 10px; border: 1px solid transparent; border-radius: 4px; background: none; color: inherit; font: 500 12px/1 inherit; cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--bg); border-color: var(--line); }
  .seg + .seg { margin-top: 4px; }
  #efforts button { flex: 1 1 30%; }
  .help { margin: 7px 0 0; font-size: 12px; color: var(--mute); }
  details { margin-top: 12px; }
  summary { font-size: 12.5px; cursor: pointer; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 12.5px; }
  select { max-width: 180px; height: 28px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: inherit; font: 12px inherit; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; cursor: pointer; }
  .check + .check { margin-top: 6px; }
  footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--mute); }
  footer a { color: inherit; }
</style>
</head>
<body>
  <header><img src="icons/48.png" alt=""><h1>AA Plus</h1><a href="https://mypriors.com" target="_blank" rel="noreferrer">by Priors</a></header>
  <div class="label">Cost pricing</div>
  <div class="seg" id="pricing" role="group" aria-label="Cost pricing">
    <button type="button" data-pricing="api">API</button>
    <button type="button" data-pricing="plan">Subscription</button>
  </div>
  <p class="help" id="pricing-help"></p>
  <div class="label">Reasoning effort</div>
  <div class="seg" id="mode" role="group" aria-label="Effort preset">
    <button type="button" data-effort="highest">Highest</button>
    <button type="button" data-effort="default">API default</button>
  </div>
  <div class="seg" id="efforts" role="group" aria-label="Efforts shown"></div>
  <p class="help" id="effort-help"></p>
  <details id="plans" hidden><summary>Plan per lab</summary><div id="labs"></div></details>
  <div class="label">Added charts</div>
  <label class="check"><input type="checkbox" id="chart"> Plan price vs. API price</label>
  <label class="check"><input type="checkbox" id="radar"> Strengths radar, in Benchmarks</label>
  <div class="label">Appearance</div>
  <div class="seg" id="theme" role="group" aria-label="Appearance">
    <button type="button" data-theme="auto">Auto</button>
    <button type="button" data-theme="light">Light</button>
    <button type="button" data-theme="dark">Dark</button>
  </div>
  <p class="help">Artificial Analysis has no dark mode of its own. Auto follows your system.</p>
  <footer><span id="data"></span><a href="https://artificialanalysis.ai" target="_blank" rel="noreferrer">Open Artificial Analysis</a></footer>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
